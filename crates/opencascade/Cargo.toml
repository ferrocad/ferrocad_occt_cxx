[package]
name = "opencascade"
description = "A high level Rust wrapper to build 3D models in code, using the OpenCascade CAD kernel"
authors = ["Brian Schwind <brianmschwind@gmail.com>"]
license = "LGPL-2.1"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/ferrocad/ferrocad_occt_cxx"

[dependencies]
cxx = "1"
opencascade-sys = { version = "0.3", path = "../opencascade-sys", package = "ferrocad_occt_cxx" }
glam = { version = "0.24", features = ["bytemuck"] }
opencascade-kicad-parser = { version = "0.3", path = "../kicad-parser" }
thiserror = "1"

[features]
# Link the OpenCASCADE shared libraries that CMake finds (`OpenCASCADE_DIR` /
# `OCCT_INCLUDE_DIR`, e.g. a micromamba/conda prefix). `builtin` opts into the
# vendored static build instead; it is not the default because it compiles the
# whole kernel from source (minutes, not seconds, and it cannot reuse the
# distribution's `.so`).
builtin = ["opencascade-sys/builtin"]
